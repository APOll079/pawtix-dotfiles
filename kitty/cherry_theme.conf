# Block cursor (shell integration would otherwise turn it into a beam at the prompt)
shell_integration no-cursor
cursor_shape block

# Padding
window_padding_width 10 7

# Scroll back up to 3000 lines.
scrollback_lines 3000

#Default font size.
font_size 11

# Ctrl+Shift+Plus / Ctrl+Shift+Minus change the font size.
map ctrl+shift+plus change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0

# Background opacity, set to 0 if you want blur/transparency.
# Blur works with hyprland, or sway-fx as a drop-in replacement for sway.
background_opacity 0.5

font_family Monaco

# Flat retro window/tab chrome (no blur, no rounding).
# The colours below are the cherry fallback. The theme's real colours come from
# theme-colors.conf (generated by quickshell/theme/apply.py), included at the end of this file,
# so a missing generated file still leaves you with cherry.
window_border_width 1
active_border_color   #c950bb
inactive_border_color #c7a4cc
tab_bar_style separator
tab_separator " | "
tab_bar_background    #321d32
active_tab_background #f4c9ef
active_tab_foreground #321d32
inactive_tab_background #3e233e
inactive_tab_foreground #f4c9ef
url_color #c950bb
cursor_text_color #321d32


# Finally, the COLORS! (cherry fallback; theme-colors.conf overrides cursor/selection/bg/fg)
cursor               #f4c9ef

selection_background #f4c9ef
selection_foreground #321d32

background           #321d32
foreground           #f4c9ef

color0               #9400ff
color8               #92fcfa
color1               #ff0000
color9               #ff0000
color2               #00ff5d
color10              #00ff5d
color3               #AC82E9
color11              #AC82E9
color4               #7b91fc
color12              #7b91fc
color5               #fce40f
color13              #fce40f
color6               #8F56E1
color14              #8F56E1
color7               #ff00ee
color15              #d3d3d3

# Theme colours from quickshell/theme/themes.json (generated; kitty skips it with a warning if missing)
include theme-colors.conf
