# spotifyd: a small Spotify Connect player (no window, ~20-40 MB) so the quickshell Spotify panel
# (Super+S) can play without the Spotify app open. Started by the dinit user service
# ~/.config/dinit.d/spotifyd. Log in once with: spotifyd authenticate
# Options: spotifyd --help (names below match 0.4.x).
[global]
device_name = "Desktop (spotifyd)"
device_type = "computer"
# PipeWire through its PulseAudio layer (pipewire-pulse), so EasyEffects and the per-app volume see it
backend = "pulseaudio"
bitrate = 320
# Spotify's own volume stage. The quickshell Spotify panel sets loudness on the PipeWire stream and
# only shows this stage (with a Max button); it never changes it by itself
volume_controller = "softvol"
initial_volume = 70
# Media controls over D-Bus: the bar's now-playing text and the lyrics follow it like the app
use_mpris = true
# Only reachable through your account, not announced on the local network
disable_discovery = true
# Keep only the login in the cache, no audio files
no_audio_cache = true
