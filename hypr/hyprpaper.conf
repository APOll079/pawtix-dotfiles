# =============================
# Wallpaper
# ~/.config/hypr/hyprpaper.conf
# =============================



# To reload when you update config: Run `killall hyprpaper` and then `hyprpaper & disown`

# Wallpaper for main monitor (your DP-2)
wallpaper {
    monitor = DP-2
    path = ~/Pictures/wallpaper.png
    fit_mode = cover
}

# Wallpaper for secondary monitor (DP-1)
wallpaper {
    monitor = DP-1
    path = ~/Pictures/wallpaper.png
    fit_mode = cover
}

# Fallback wallpaper for any monitor not explicitly listed
wallpaper {
    monitor = 
    path = ~/Pictures/wallpaper.png
    fit_mode = cover
}

splash = false

