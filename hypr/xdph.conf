# Config for xdg-desktop-portal-hyprland (the screen-share portal). This is the portal's own
# file, not Hyprland's config, so it is not Lua.
# The share picker is a Quickshell dialog (quickshell/sharepicker.qml) started by this wrapper.
# The path is absolute on purpose: "~" is not expanded here. @HOME@ is a placeholder that
# install.sh / deploy.sh replace with your real $HOME when they copy this file to ~/.config. Restart the portal after changing it
# (pkill xdg-desktop-portal-hyprland; it starts again on the next share request).
screencopy {
    custom_picker_binary = @HOME@/.config/quickshell/scripts/share-picker.sh
}
