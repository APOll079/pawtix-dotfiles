# Cherry lock screen: flat panel with a hard shadow, no rounding/blur/animation.
# Shape/label/input-field options checked against the hyprlock wiki (v0.9.x).

# Cherry fallback colours. The theme's real colours come from hyprlock-colors.conf (generated by
# quickshell/theme/apply.py), sourced right below so it overrides these. If that file is missing,
# hyprlock logs "Proceeding ignoring faulty entries" and locks with these cherry values (tested).
$base      = rgba(f4c9efff)
$shadow    = rgba(c7a4ccff)
$highlight = rgba(f9d0f7ff)
$urgent    = rgba(ff936cff)
$accent    = rgba(c950bbff)
$text      = rgba(321d32ff)
$outline   = rgba(20091dff)
source = ~/.config/hypr/hyprlock-colors.conf

$font = Monaco

general {
  hide_cursor = true
}

animations {
  enabled = false
}

# BACKGROUND: the wallpaper each monitor shows on the desktop. The $wallpaper_* variables come from
# hyprlock-wallpaper.conf (written by Quickshell's wallpaper browser); until that exists, or for an
# output it doesn't list, they stay on wallpaper.png.
# The image paths start with a home-folder placeholder that install.sh / deploy.sh fill in when they copy this file
$wallpaper_DP_2 = @HOME@/Pictures/wallpaper.png
$wallpaper_DP_1 = @HOME@/Pictures/wallpaper.png
source = ~/.config/hypr/hyprlock-wallpaper.conf

background {
  monitor = DP-2
  path = $wallpaper_DP_2
  color = $base
  blur_passes = 0
}

background {
  monitor = DP-1
  path = $wallpaper_DP_1
  color = $base
  blur_passes = 0
}

# PANEL SHADOW (hard offset, down-right)
shape {
  monitor =
  size = 420, 320
  color = $shadow
  rounding = 0
  border_size = 0
  position = 4, -4
  halign = center
  valign = center
  zindex = 0
}

# PANEL
shape {
  monitor =
  size = 420, 320
  color = $base
  rounding = 0
  border_size = 1
  border_color = $outline
  position = 0, 0
  halign = center
  valign = center
  zindex = 1
}

# TITLE BAR
shape {
  monitor =
  size = 418, 22
  color = $accent
  rounding = 0
  border_size = 0
  position = 0, 148
  halign = center
  valign = center
  zindex = 2
}

label {
  monitor =
  text = Locked
  color = $base
  font_size = 12
  font_family = $font
  position = 0, 148
  halign = center
  valign = center
  zindex = 3
}

# USER AVATAR
image {
  monitor =
  path = @HOME@/Pictures/profile.PNG
  size = 80
  rounding = 0
  border_size = 1
  border_color = $outline
  position = 0, 85
  halign = center
  valign = center
  zindex = 3
}

# TIME
label {
  monitor =
  text = $TIME
  color = $text
  font_size = 40
  font_family = $font
  position = 0, 10
  halign = center
  valign = center
  zindex = 3
}

# DATE
label {
  monitor =
  text = cmd[update:60000] date +"%A, %d %B %Y"
  color = $text
  font_size = 14
  font_family = $font
  position = 0, -25
  halign = center
  valign = center
  zindex = 3
}

# INPUT FIELD
input-field {
  monitor =
  size = 300, 36
  outline_thickness = 1
  rounding = 0
  dots_size = 0.25
  dots_spacing = 0.2
  dots_center = true
  outer_color = $outline
  inner_color = $highlight
  font_color = $text
  font_family = $font
  fade_on_empty = false
  placeholder_text = Logged in as $USER
  hide_input = false
  check_color = $accent
  fail_color = $urgent
  fail_text = $FAIL ($ATTEMPTS)
  capslock_color = $urgent
  position = 0, -75
  halign = center
  valign = center
  zindex = 3
}

# FINGERPRINT PROMPT (empty unless fprintd is active)
label {
  monitor =
  text = $FPRINTPROMPT
  color = $text
  font_size = 12
  font_family = $font
  position = 0, -110
  halign = center
  valign = center
  zindex = 3
}

# LAYOUT
label {
  monitor =
  text = Layout: $LAYOUT
  color = $text
  font_size = 11
  font_family = $font
  position = 0, -140
  halign = center
  valign = center
  zindex = 3
}
