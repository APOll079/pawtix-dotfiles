# Generated by quickshell/theme/apply.py from quickshell/theme/themes.json (theme: {{theme}}). Edit the template in quickshell/theme/templates/, not this file.
# Dark like the kitty and btop themes: the terminal background shows through, text is the base colour.

[processes]
# One row per program name: the PID column shows how many processes are in the group, usage is summed.
# Tab toggles it in the process table.
default_grouped = true

[styles.cpu]
all_entry_colour = "{{highlight}}"
avg_entry_colour = "{{accent}}"
cpu_core_colours = ["{{accent}}", "{{highlight}}", "{{shadow}}", "{{urgent}}"]

[styles.memory]
ram_colour = "{{accent}}"
cache_colour = "{{shadow}}"
swap_colour = "{{urgent}}"
gpu_colours = ["{{highlight}}", "{{shadow}}"]

[styles.network]
rx_colour = "{{accent}}"
tx_colour = "{{urgent}}"
rx_total_colour = "{{shadow}}"
tx_total_colour = "{{highlight}}"

[styles.tables]
headers = { colour = "{{highlight}}", bold = true }

[styles.graphs]
graph_colour = "{{shadow}}"
legend_text = "{{base}}"

[styles.widgets]
border_colour = "{{shadow}}"
selected_border_colour = "{{accent}}"
widget_title = { colour = "{{highlight}}", bold = true }
text = "{{base}}"
selected_text = { colour = "{{select_text}}", bg_colour = "{{select_bar}}", bold = true }
disabled_text = "{{shadow}}"
bar_type = "block"
